<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" role="img" aria-label="Arcbound monorepo layout diagram">
<style>
  text{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;fill:#E8ECF5}
  .ttl{font-size:15px;font-weight:700;fill:#E8ECF5}
  .stp{font-size:11px;font-weight:700;fill:#FFB347;letter-spacing:2px}
  .n-title{font-size:14px;font-weight:700}
  .n-sub{font-size:11px;fill:#98A2B8}
  .lane-label{font-size:10px;fill:#8A94AD;letter-spacing:2px}
  .edge{stroke:#FFB347;stroke-width:2;fill:none}
  .edge.data{stroke:#5FE3D0;stroke-dasharray:5 4;fill:none}
  .edge.ctl{stroke:#FF5C8A;stroke-width:1.5;opacity:.85;fill:none}
  .elabel{font-size:11px;fill:#98A2B8}
  .elabel.data{fill:#5FE3D0}
  .elabel.ctl{fill:#FF5C8A}
  .node{fill:#0E1322;stroke:#31406A;stroke-width:1}
  .node.hot{stroke:#FFB347;stroke-width:1.5;filter:url(#glow1)}
  .node.data{stroke:#5FE3D0}
  .node.dim{stroke:#26304F}
  .lane{fill:rgba(19,24,40,.6);stroke:#232D47;stroke-width:1;stroke-dasharray:2 4}
  .chip{fill:url(#chk1);stroke:#31406A;stroke-width:1}
  .marquee{fill:none;stroke:#FFB347;stroke-width:1.5;stroke-dasharray:4 4}
  @media (prefers-reduced-motion:no-preference){
    .marquee1{animation:march1 1.2s linear infinite}
    @keyframes march1{to{stroke-dashoffset:-16}}
  }
</style>
<defs>
  <pattern id="chk1" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#1A2136"/>
    <rect width="4" height="4" fill="#2A3452"/>
    <rect x="4" y="4" width="4" height="4" fill="#2A3452"/>
  </pattern>
  <filter id="glow1" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#FFB347" flood-opacity="0.28"/>
  </filter>
  <marker id="arr1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L8 4 L0 8 z" fill="#FFB347"/>
  </marker>
  <marker id="arrData1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L8 4 L0 8 z" fill="#5FE3D0"/>
  </marker>
  <marker id="arrCtl1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L8 4 L0 8 z" fill="#FF5C8A"/>
  </marker>
</defs>

<rect x="0" y="0" width="1060" height="660" fill="#121828"/>
<rect x="0.5" y="0.5" width="1059" height="659" fill="none" stroke="#232D47"/>

<text class="stp" x="20" y="28">[1/7]</text>
<text class="ttl" x="84" y="28">MONOREPO LAYOUT — one shared code path, two runtimes</text>

<g transform="translate(0,48)">
  <rect class="lane" x="24" y="16" width="300" height="470"/>
  <text class="lane-label" x="40" y="40">SRC/CLIENT — BROWSER GAME</text>
  <rect class="lane" x="360" y="16" width="320" height="470"/>
  <text class="lane-label" x="376" y="40">SRC/SHARED — DETERMINISTIC SIM</text>
  <rect class="lane" x="716" y="16" width="320" height="470"/>
  <text class="lane-label" x="732" y="40">SRC/SERVER — GAME SERVER</text>

  <!-- CLIENT column -->
  <g>
    <rect class="node" x="40" y="60" width="268" height="58"/>
    <rect class="chip" x="284" y="68" width="14" height="14"/>
    <text class="n-title" x="54" y="86">Pixi.js WebGL rendering</text>
    <text class="n-sub" x="54" y="105">arena, HUD, minimap, particles</text>
  </g>
  <g>
    <rect class="node" x="40" y="130" width="268" height="58"/>
    <rect class="chip" x="284" y="138" width="14" height="14"/>
    <text class="n-title" x="54" y="156">Prediction layer</text>
    <text class="n-sub" x="54" y="175">local player + remote interp</text>
  </g>
  <g>
    <rect class="node" x="40" y="200" width="268" height="58"/>
    <rect class="chip" x="284" y="208" width="14" height="14"/>
    <text class="n-title" x="54" y="226">NetworkClient</text>
    <text class="n-sub" x="54" y="245">WebRTC transport</text>
  </g>
  <g>
    <rect class="node" x="40" y="270" width="268" height="48"/>
    <rect class="chip" x="284" y="278" width="14" height="14"/>
    <text class="n-title" x="54" y="299">Tutorial build</text>
  </g>
  <g>
    <rect class="node" x="40" y="330" width="268" height="48"/>
    <rect class="chip" x="284" y="338" width="14" height="14"/>
    <text class="n-title" x="54" y="359">Discord Activity integration</text>
  </g>
  <g>
    <rect class="node" x="40" y="390" width="268" height="58"/>
    <rect class="chip" x="284" y="398" width="14" height="14"/>
    <text class="n-title" x="54" y="416">UI layer</text>
    <text class="n-sub" x="54" y="435">dialogs, keybinds, social</text>
  </g>

  <!-- SHARED column -->
  <g>
    <rect class="node hot" x="376" y="60" width="288" height="58"/>
    <rect class="marquee marquee1" x="371" y="55" width="298" height="68"/>
    <rect class="chip" x="640" y="68" width="14" height="14"/>
    <text class="n-title" x="390" y="86">Movement + projectile physics</text>
    <text class="n-sub" x="390" y="105">fixed-timestep, deterministic</text>
  </g>
  <g>
    <rect class="node" x="376" y="130" width="288" height="48"/>
    <rect class="chip" x="640" y="138" width="14" height="14"/>
    <text class="n-title" x="390" y="159">Collision masks</text>
  </g>
  <g>
    <rect class="node data" x="376" y="190" width="288" height="48"/>
    <rect class="chip" x="640" y="198" width="14" height="14"/>
    <text class="n-title" x="390" y="219">Snapshot protocol</text>
  </g>
  <g>
    <rect class="node data" x="376" y="250" width="288" height="48"/>
    <rect class="chip" x="640" y="258" width="14" height="14"/>
    <text class="n-title" x="390" y="279">Tile compression (RLE)</text>
  </g>
  <g>
    <rect class="node" x="376" y="310" width="288" height="58"/>
    <rect class="chip" x="640" y="318" width="14" height="14"/>
    <text class="n-title" x="390" y="336">Entities</text>
    <text class="n-sub" x="390" y="355">Player, Arena, DungeonGenerator</text>
  </g>
  <g>
    <rect class="node" x="376" y="380" width="288" height="48"/>
    <rect class="chip" x="640" y="388" width="14" height="14"/>
    <text class="n-title" x="390" y="409">Clock sync</text>
  </g>

  <!-- SERVER column -->
  <g>
    <rect class="node" x="732" y="60" width="288" height="58"/>
    <rect class="chip" x="996" y="68" width="14" height="14"/>
    <text class="n-title" x="746" y="86">GameServer</text>
    <text class="n-sub" x="746" y="105">Express HttpServer</text>
  </g>
  <g>
    <rect class="node" x="732" y="130" width="288" height="58"/>
    <rect class="chip" x="996" y="138" width="14" height="14"/>
    <text class="n-title" x="746" y="156">Rooms</text>
    <text class="n-sub" x="746" y="175">Staging / Arena / Dungeon</text>
  </g>
  <g>
    <rect class="node" x="732" y="200" width="288" height="48"/>
    <rect class="chip" x="996" y="208" width="14" height="14"/>
    <text class="n-title" x="746" y="229">Game-mode plugins</text>
  </g>
  <g>
    <rect class="node" x="732" y="260" width="288" height="58"/>
    <rect class="chip" x="996" y="268" width="14" height="14"/>
    <text class="n-title" x="746" y="286">AI subsystem</text>
    <text class="n-sub" x="746" y="305">rule-based + RL inference</text>
  </g>
  <g>
    <rect class="node" x="732" y="330" width="288" height="48"/>
    <rect class="chip" x="996" y="338" width="14" height="14"/>
    <text class="n-title" x="746" y="359">Accounts &amp; auth</text>
  </g>
  <g>
    <rect class="node" x="732" y="390" width="288" height="48"/>
    <rect class="chip" x="996" y="398" width="14" height="14"/>
    <text class="n-title" x="746" y="419">Map parser / writer</text>
  </g>

  <!-- bottom nodes -->
  <g>
    <rect class="node" x="40" y="520" width="288" height="58"/>
    <rect class="chip" x="304" y="528" width="14" height="14"/>
    <text class="n-title" x="54" y="546">scripts/ — Python RL training</text>
    <text class="n-sub" x="54" y="565">pipeline + ops tooling</text>
  </g>
  <g>
    <rect class="node dim" x="436" y="520" width="240" height="58"/>
    <text class="n-title" x="450" y="546" fill="#B8C0D4">ARCnet library</text>
    <text class="n-sub" x="450" y="565">sibling package</text>
  </g>

  <!-- lane-to-shared primary edges -->
  <path class="edge" d="M308 240 H344 V149 H372" marker-end="url(#arr1)"/>
  <text class="elabel" x="326" y="200" text-anchor="middle">uses</text>
  <path class="edge" d="M732 149 H700 V214 H668" marker-end="url(#arr1)"/>
  <text class="elabel" x="712" y="200" text-anchor="middle">uses</text>

  <!-- ARCnet plumbing links -->
  <path class="edge ctl" d="M174 258 V500 H436 V516" marker-end="url(#arrCtl1)"/>
  <path class="edge ctl" d="M876 118 V150 H556 V516" marker-end="url(#arrCtl1)"/>

  <!-- scripts to AI data edge -->
  <path class="edge data" d="M328 549 H400 V289 H728" marker-end="url(#arrData1)"/>
  <text class="elabel data" x="410" y="470" text-anchor="start">trains / deploys policies</text>
</g>
</svg>
