<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" role="img" aria-label="AI subsystem diagram">
<style>
  text{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;fill:#E8ECF5}
  .ttl{font-size:15px;font-weight:700;fill:#E8ECF5}
  .stp{font-size:11px;font-weight:700;fill:#FFB347;letter-spacing:2px}
  .n-title{font-size:14px;font-weight:700}
  .n-sub{font-size:11px;fill:#98A2B8}
  .lane-label{font-size:10px;fill:#8A94AD;letter-spacing:2px}
  .edge{stroke:#FFB347;stroke-width:2;fill:none}
  .edge.data{stroke:#5FE3D0;stroke-dasharray:5 4;fill:none}
  .elabel{font-size:11px;fill:#98A2B8}
  .elabel.data{fill:#5FE3D0}
  .node{fill:#0E1322;stroke:#31406A;stroke-width:1}
  .node.hot{stroke:#FFB347;stroke-width:1.5;filter:url(#glow5)}
  .node.data{stroke:#5FE3D0}
  .lane{fill:rgba(19,24,40,.6);stroke:#232D47;stroke-width:1;stroke-dasharray:2 4}
  .chip{fill:url(#chk5);stroke:#31406A;stroke-width:1}
  .marquee{fill:none;stroke:#FFB347;stroke-width:1.5;stroke-dasharray:4 4}
  @media (prefers-reduced-motion:no-preference){
    .marquee5{animation:march5 1.2s linear infinite}
    @keyframes march5{to{stroke-dashoffset:-16}}
  }
</style>
<defs>
  <pattern id="chk5" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#1A2136"/>
    <rect width="4" height="4" fill="#2A3452"/>
    <rect x="4" y="4" width="4" height="4" fill="#2A3452"/>
  </pattern>
  <filter id="glow5" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#FFB347" flood-opacity="0.28"/>
  </filter>
  <marker id="arr5" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L8 4 L0 8 z" fill="#FFB347"/>
  </marker>
  <marker id="arrData5" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L8 4 L0 8 z" fill="#5FE3D0"/>
  </marker>
</defs>

<rect x="0" y="0" width="1060" height="660" fill="#121828"/>
<rect x="0.5" y="0.5" width="1059" height="659" fill="none" stroke="#232D47"/>

<text class="stp" x="20" y="28">[5/7]</text>
<text class="ttl" x="84" y="28">AI SUBSYSTEM — rule-based and learned layers cooperate</text>

<g transform="translate(0,48)">
  <rect class="lane" x="40" y="40" width="440" height="368"/>
  <text class="lane-label" x="56" y="64">RULE-BASED LAYER</text>
  <rect class="lane" x="580" y="40" width="440" height="368"/>
  <text class="lane-label" x="596" y="64">LEARNED LAYER</text>

  <!-- rule-based nodes -->
  <g>
    <rect class="node" x="70" y="78" width="380" height="58"/>
    <rect class="chip" x="426" y="86" width="14" height="14"/>
    <text class="n-title" x="84" y="104">Pathfinding + map analysis</text>
    <text class="n-sub" x="84" y="123">+ curated routes</text>
  </g>
  <g>
    <rect class="node" x="70" y="148" width="380" height="44"/>
    <rect class="chip" x="426" y="156" width="14" height="14"/>
    <text class="n-title" x="84" y="175">Perception &amp; threat modeling</text>
  </g>
  <g>
    <rect class="node" x="70" y="204" width="380" height="44"/>
    <rect class="chip" x="426" y="212" width="14" height="14"/>
    <text class="n-title" x="84" y="231">Weapon-line solving</text>
  </g>
  <g>
    <rect class="node" x="70" y="260" width="380" height="58"/>
    <rect class="chip" x="426" y="268" width="14" height="14"/>
    <text class="n-title" x="84" y="286">Playmaking directives</text>
    <text class="n-sub" x="84" y="305">pincer, power play, disengage</text>
  </g>
  <g>
    <rect class="node" x="70" y="330" width="380" height="58"/>
    <rect class="chip" x="426" y="338" width="14" height="14"/>
    <text class="n-title" x="84" y="356">Opponent fire-pattern tracking</text>
    <text class="n-sub" x="84" y="375">&#8594; dodge axis selection</text>
  </g>

  <!-- learned nodes -->
  <g>
    <rect class="node data" x="610" y="78" width="380" height="44"/>
    <rect class="chip" x="966" y="86" width="14" height="14"/>
    <text class="n-title" x="624" y="105">Observation builder + normalizer</text>
  </g>
  <g>
    <rect class="node data" x="610" y="134" width="380" height="58"/>
    <rect class="chip" x="966" y="142" width="14" height="14"/>
    <text class="n-title" x="624" y="160">Policy network (MLP)</text>
    <text class="n-sub" x="624" y="179">pure-TS forward pass over JSON weights</text>
  </g>
  <g>
    <rect class="node data" x="610" y="204" width="380" height="44"/>
    <rect class="chip" x="966" y="212" width="14" height="14"/>
    <text class="n-title" x="624" y="231">Action masking</text>
  </g>
  <g>
    <rect class="node" x="610" y="260" width="380" height="58"/>
    <rect class="chip" x="966" y="268" width="14" height="14"/>
    <text class="n-title" x="624" y="286">Per-player clone personas</text>
    <text class="n-sub" x="624" y="305">+ adaptive difficulty</text>
  </g>

  <!-- DEC hot -->
  <g>
    <rect class="node hot" x="320" y="440" width="420" height="58"/>
    <rect class="marquee marquee5" x="315" y="435" width="430" height="68"/>
    <rect class="chip" x="716" y="448" width="14" height="14"/>
    <text class="n-title" x="334" y="466">Utility-scoring decision substrate</text>
    <text class="n-sub" x="334" y="485">candidate intents &#8594; score &#8594; select</text>
  </g>
  <!-- CTRL -->
  <g>
    <rect class="node" x="380" y="540" width="300" height="58"/>
    <rect class="chip" x="656" y="548" width="14" height="14"/>
    <text class="n-title" x="394" y="566">Per-bot controller</text>
    <text class="n-sub" x="394" y="585">&#8594; game inputs</text>
  </g>

  <!-- learned inference chain (data) -->
  <path class="edge data" d="M800 122 V132" marker-end="url(#arrData5)"/>
  <path class="edge data" d="M800 192 V202" marker-end="url(#arrData5)"/>
  <path class="edge data" d="M800 248 V522 H650 V538" marker-end="url(#arrData5)"/>

  <!-- rules --> DEC, rl --> DEC -->
  <path class="edge" d="M260 408 V422 H430 V438" marker-end="url(#arr5)"/>
  <text class="elabel" x="300" y="428" text-anchor="start">intents</text>
  <path class="edge" d="M800 408 V422 H630 V438" marker-end="url(#arr5)"/>
  <text class="elabel" x="640" y="428" text-anchor="start">intents</text>

  <!-- DEC --> CTRL -->
  <path class="edge" d="M530 498 V538" marker-end="url(#arr5)"/>
</g>
</svg>
