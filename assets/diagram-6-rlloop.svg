<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 590" role="img" aria-label="Reinforcement learning loop diagram">
<style>
  text{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;fill:#E8ECF5}
  .ttl{font-size:15px;font-weight:700;fill:#E8ECF5}
  .stp{font-size:11px;font-weight:700;fill:#FFB347;letter-spacing:2px}
  .n-title{font-size:14px;font-weight:700}
  .n-sub{font-size:11px;fill:#98A2B8}
  .edge{stroke:#FFB347;stroke-width:2;fill:none}
  .edge.data{stroke:#5FE3D0;stroke-dasharray:5 4;fill:none}
  .elabel{font-size:11px;fill:#98A2B8}
  .elabel.data{fill:#5FE3D0}
  .node{fill:#0E1322;stroke:#31406A;stroke-width:1}
  .node.hot{stroke:#FFB347;stroke-width:1.5;filter:url(#glow6)}
  .node.data{stroke:#5FE3D0}
  .node.dim{stroke:#26304F}
  .chip{fill:url(#chk6);stroke:#31406A;stroke-width:1}
  .marquee{fill:none;stroke:#FFB347;stroke-width:1.5;stroke-dasharray:4 4}
  @media (prefers-reduced-motion:no-preference){
    .marquee6{animation:march6 1.2s linear infinite}
    @keyframes march6{to{stroke-dashoffset:-16}}
  }
</style>
<defs>
  <pattern id="chk6" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#1A2136"/>
    <rect width="4" height="4" fill="#2A3452"/>
    <rect x="4" y="4" width="4" height="4" fill="#2A3452"/>
  </pattern>
  <filter id="glow6" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#FFB347" flood-opacity="0.28"/>
  </filter>
  <marker id="arr6" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L8 4 L0 8 z" fill="#FFB347"/>
  </marker>
  <marker id="arrData6" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L8 4 L0 8 z" fill="#5FE3D0"/>
  </marker>
</defs>

<rect x="0" y="0" width="1060" height="590" fill="#121828"/>
<rect x="0.5" y="0.5" width="1059" height="589" fill="none" stroke="#232D47"/>

<text class="stp" x="20" y="28">[6/7]</text>
<text class="ttl" x="84" y="28">RL LOOP — collect, train, export, deploy, infer</text>

<g transform="translate(0,48)">
  <!-- top row -->
  <g>
    <rect class="node" x="40" y="80" width="300" height="90"/>
    <rect class="chip" x="316" y="88" width="14" height="14"/>
    <text class="n-title" x="54" y="108">1 · Collect</text>
    <text class="n-sub" x="54" y="129">live matches + self-play</text>
    <text class="n-sub" x="54" y="148">emit experience rollouts</text>
  </g>
  <g>
    <rect class="node" x="380" y="80" width="300" height="90"/>
    <rect class="chip" x="656" y="88" width="14" height="14"/>
    <text class="n-title" x="394" y="108">2 · Pull</text>
    <text class="n-sub" x="394" y="129">pipeline polls the server,</text>
    <text class="n-sub" x="394" y="148">fetches rollouts at threshold</text>
  </g>
  <g>
    <rect class="node" x="720" y="74" width="320" height="102"/>
    <rect class="chip" x="1016" y="82" width="14" height="14"/>
    <text class="n-title" x="734" y="100">3 · Train — ABI-PPO (PyTorch)</text>
    <text class="n-sub" x="734" y="121">staged curriculum,</text>
    <text class="n-sub" x="734" y="139">decoupled actor/critic optimizers,</text>
    <text class="n-sub" x="734" y="157">decomposed rewards</text>
  </g>

  <!-- bottom row -->
  <g>
    <rect class="node data" x="720" y="330" width="320" height="90"/>
    <rect class="chip" x="1016" y="338" width="14" height="14"/>
    <text class="n-title" x="734" y="358">4 · Export</text>
    <text class="n-sub" x="734" y="379">checkpoint &#8594; JSON weights</text>
    <text class="n-sub" x="734" y="398">+ observation-normalizer stats</text>
  </g>
  <g>
    <rect class="node hot" x="380" y="330" width="300" height="90"/>
    <rect class="marquee marquee6" x="375" y="325" width="310" height="100"/>
    <rect class="chip" x="656" y="338" width="14" height="14"/>
    <text class="n-title" x="394" y="358">5 · Deploy</text>
    <text class="n-sub" x="394" y="379">sanity gate, auto-backup,</text>
    <text class="n-sub" x="394" y="398">ship to live server</text>
  </g>
  <g>
    <rect class="node" x="40" y="330" width="300" height="90"/>
    <rect class="chip" x="316" y="338" width="14" height="14"/>
    <text class="n-title" x="54" y="358">6 · Infer</text>
    <text class="n-sub" x="54" y="379">hot-reload — bots pick up</text>
    <text class="n-sub" x="54" y="398">new policy, no restart</text>
  </g>

  <!-- rollback -->
  <g>
    <rect class="node dim" x="380" y="470" width="300" height="58"/>
    <text class="n-title" x="394" y="496" fill="#B8C0D4">one-command rollback</text>
    <text class="n-sub" x="394" y="515">to the previous policy</text>
  </g>

  <!-- cycle edges -->
  <path class="edge" d="M340 125 H378" marker-end="url(#arr6)"/>
  <path class="edge" d="M680 125 H718" marker-end="url(#arr6)"/>
  <path class="edge" d="M880 176 V330" marker-end="url(#arr6)"/>
  <path class="edge" d="M720 375 H682" marker-end="url(#arr6)"/>
  <path class="edge" d="M380 375 H342" marker-end="url(#arr6)"/>
  <path class="edge" d="M190 330 V172" marker-end="url(#arr6)"/>

  <!-- DEPLOY -.-> ROLLBACK -->
  <path class="edge data" d="M530 420 V468" marker-end="url(#arrData6)"/>
  <text class="elabel data" x="540" y="452" text-anchor="start">on failed go-live</text>
</g>
</svg>
